bridge:
  ros__parameters:
    # Topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'

    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # Transform related
    scan_distance_to_base_link: 0.0

    # LaserScan parameters
    scan_fov: 4.7
    scan_beams: 1080
    scan_range_max: 12.0

    # Map parameters
    map_path: '/home/dont_reinstall/F1Tenth-Repository/src/f1tenth_gym_ros/maps/Catalunya_map'
    map_img_ext: '.png'

    # Opponent parameters
    num_agent: 1

    # Ego starting pose
    sx: 0.0
    sy: 0.0
    stheta: -2.14363

    # Opponent starting pose
    sx1: 9.5
    sy1: 8.5
    stheta1: 3.14

    # Teleoperation
    # The Follow-the-Gap controller owns ego drive by default. Enable only when
    # intentionally using a /cmd_vel teleop publisher (it overrides /drive).
    kb_teleop: false

    # Stop applying a latched command when its publisher disappears.
    command_timeout: 0.5
